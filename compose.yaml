name: feedback-portal

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  environment:
    DATABASE_HOST: db
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: postgres
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    <<: *app
    command: bash -c "bin/rails tailwindcss:build && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "${WEB_PORT:-3000}:3000"

  css:
    <<: *app
    command: bin/rails tailwindcss:watch[always]
    tty: true

  # Separate app instance + database for Playwright e2e (reset before each run).
  e2e:
    <<: *app
    profiles: ["e2e"]
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: feedback_portal_e2e
      SIGNIN_RATE_LIMIT: "1000"
    command: bash -c "bin/rails tailwindcss:build && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000 -P tmp/pids/e2e.pid"
    ports:
      - "${E2E_PORT:-3100}:3000"

volumes:
  pgdata:
  bundle:
